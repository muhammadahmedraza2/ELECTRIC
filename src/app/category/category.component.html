<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h5 class="mb-0">{{ categoryName }} — Items</h5>
  <span class="text-muted small">{{ filteredItems().length }} item(s)</span>
</div>

<div class="shop-toolbar">
  <input type="text" class="toolbar-input" placeholder="Search in {{ categoryName }}..." [(ngModel)]="searchTerm">
  <select class="toolbar-select" [ngModel]="sortBy()" (change)="setSort($event)">
    <option value="name-asc">Sort: Name (A–Z)</option>
    <option value="price-asc">Sort: Price (Low to High)</option>
    <option value="price-desc">Sort: Price (High to Low)</option>
    <option value="stock-desc">Sort: Stock (High to Low)</option>
  </select>
</div>

<div class="item-grid" *ngIf="filteredItems().length; else empty">
  <div class="item-card" *ngFor="let item of filteredItems()">
    <button class="fav-btn" (click)="toggleFav(item)">
      <i class="bi" [ngClass]="fav.isFavorite(item.id) ? 'bi-heart-fill text-danger' : 'bi-heart'"></i>
    </button>
    <div class="item-icon"><i class="bi bi-box-seam"></i></div>
    <h6>{{ item.name }}</h6>
    <span class="item-meta">{{ item.brand }} · Stock: {{ item.stock }}</span>
    <span class="badge-status align-self-start" [ngClass]="{
            'badge-instock': item.status === 'In Stock',
            'badge-low': item.status === 'Low Stock',
            'badge-out': item.status === 'Out of Stock'
          }">{{ item.status }}</span>
    <div class="item-card-footer">
      <span class="item-price">Rs {{ item.price | number }}</span>
      <button class="add-btn" [disabled]="item.stock === 0" (click)="add(item)">
        <i class="bi bi-cart-plus"></i>
      </button>
    </div>
  </div>
</div>

<ng-template #empty>
  <div class="card-surface text-center text-muted py-5">
    No items found in this category yet.
  </div>
</ng-template>
