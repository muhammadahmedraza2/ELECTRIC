<div class="offer-banner">
  <div class="offer-icon"><i class="bi" [ngClass]="offer.image"></i></div>
  <div class="offer-content">
    <h6>{{ offer.title }}</h6>
    <p>{{ offer.description }}</p>
    <span class="offer-pill">Up to {{ offer.discount }}% OFF</span>
  </div>
  <a class="btn-app-outline btn" routerLink="/app/offers">Shop Now</a>
</div>
