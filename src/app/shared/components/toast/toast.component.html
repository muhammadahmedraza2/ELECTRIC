<div class="toast-stack">
  <div class="toast-item" *ngFor="let t of toastService.toasts()" [ngClass]="'toast-' + t.type">
    <i class="bi" [ngClass]="{
      'bi-check-circle-fill': t.type === 'success',
      'bi-x-circle-fill': t.type === 'error',
      'bi-info-circle-fill': t.type === 'info'
    }"></i>
    <span>{{ t.message }}</span>
    <button (click)="toastService.dismiss(t.id)"><i class="bi bi-x"></i></button>
  </div>
</div>
