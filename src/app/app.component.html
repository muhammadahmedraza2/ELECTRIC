<div class="app-shell">

  <!-- SIDEBAR: dashboard, sab electric categories (node-wise), settings/privacy -->
  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="brand">
      <i class="bi bi-lightning-charge-fill"></i>
      <span>Electro Inventory</span>
    </div>

    <a class="sidebar-link" routerLink="/dashboard" routerLinkActive="active">
      <i class="bi bi-grid-1x2-fill"></i> Dashboard
    </a>

    <div class="sidebar-section-title">Electric Items</div>
    <a class="sidebar-link"
       *ngFor="let cat of data.categories"
       [routerLink]="['/category', cat.slug]"
       routerLinkActive="active">
      <i class="bi" [ngClass]="cat.icon"></i> {{ cat.name }}
    </a>

    <div class="sidebar-section-title">Shop</div>
    <a class="sidebar-link" routerLink="/pos" routerLinkActive="active">
      <i class="bi bi-shop"></i> POS (Point of Sale)
    </a>
    <a class="sidebar-link" routerLink="/cart" routerLinkActive="active">
      <i class="bi bi-cart3"></i> Cart
      <span class="sidebar-badge" *ngIf="cart.cartCount() > 0">{{ cart.cartCount() }}</span>
    </a>
    <a class="sidebar-link" routerLink="/favorites" routerLinkActive="active">
      <i class="bi bi-heart-fill"></i> Favorites
    </a>
    <a class="sidebar-link" routerLink="/sales" routerLinkActive="active">
      <i class="bi bi-receipt"></i> Sales
    </a>

    <div class="sidebar-section-title">System</div>
    <a class="sidebar-link" routerLink="/settings" routerLinkActive="active">
      <i class="bi bi-gear-fill"></i> Settings & Privacy
    </a>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-app-outline d-md-none" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <h5>Electronics Inventory Dashboard</h5>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button class="btn-app-outline btn position-relative" routerLink="/cart">
          <i class="bi bi-cart3"></i>
          <span class="sidebar-badge topbar-badge" *ngIf="cart.cartCount() > 0">{{ cart.cartCount() }}</span>
        </button>
        <button class="btn-app-primary btn" routerLink="/settings">
          <i class="bi bi-gear me-1"></i> Preferences
        </button>
      </div>
    </header>

    <main class="page-body">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      &copy; {{ currentYear }} Electro Inventory — All items managed in one dashboard.
    </footer>
  </div>

</div>
