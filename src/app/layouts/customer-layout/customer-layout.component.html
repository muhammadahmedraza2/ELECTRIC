<div class="store-shell">
  <header class="store-header">
    <a class="store-brand" routerLink="/store/products" [attr.aria-label]="(activeBusiness()?.name || 'Business store') + ' home'">
      <span class="store-brand-mark" [style.background]="activeBusiness()?.defaultTheme?.primaryColor || null">
        <i class="bi" [ngClass]="activeBusiness()?.icon || 'bi-grid-1x2'"></i>
      </span>
      <span>{{ activeBusiness()?.name || 'Business store' }}</span>
    </a>
    <nav class="store-nav" aria-label="Store navigation">
      <a routerLink="/store/products" routerLinkActive="active">Shop</a>
      <a routerLink="/store/offers" routerLinkActive="active">Offers</a>
      <a routerLink="/store/orders" routerLinkActive="active">My orders</a>
    </nav>
    <a class="store-cart" routerLink="/store/cart" aria-label="Shopping cart">
      <i class="bi bi-bag"></i>
      <span>Cart</span>
      @if (cart.itemCount() > 0) {
        <span class="store-cart-count">{{ cart.itemCount() }}</span>
      }
    </a>
  </header>

  <main class="store-content">
    <router-outlet></router-outlet>
  </main>
  <app-footer [storeMode]="true"></app-footer>
</div>
