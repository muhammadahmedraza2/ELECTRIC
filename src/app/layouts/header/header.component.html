<header class="app-header">
  <button class="btn-app-outline btn d-lg-none" (click)="toggleSidebar.emit()">
    <i class="bi bi-list"></i>
  </button>

  <h5 class="header-title d-none d-lg-block">{{ activeBusiness()?.name || 'Business' }} Console</h5>

  <div class="header-actions">
    <label class="header-search d-none d-md-flex">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input type="search" placeholder="Search workspace" aria-label="Search workspace">
      <kbd>Ctrl K</kbd>
    </label>

    <button class="header-icon-btn" (click)="toggleDarkMode()" title="Toggle theme">
      <i class="bi" [ngClass]="theme.theme().mode === 'dark' ? 'bi-sun' : 'bi-moon-stars'"></i>
    </button>

    <button class="header-icon-btn" title="Notifications" aria-label="Notifications">
      <i class="bi bi-bell"></i>
      <span class="header-badge">3</span>
    </button>

    <a class="header-icon-btn" routerLink="/admin/settings" title="Settings" aria-label="Settings">
      <i class="bi bi-gear"></i>
    </a>

    <div class="header-user">
      <div class="user-avatar">AK</div>
      <span class="d-none d-md-inline">Admin User</span>
    </div>
  </div>
</header>
