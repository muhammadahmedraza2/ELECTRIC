<div class="page-header">
  <div>
    <h4>My Wishlist</h4>
    <p class="text-muted mb-0">{{ wishlistedProducts().length }} saved item(s)</p>
  </div>
</div>

<app-loading *ngIf="loading()" message="Loading wishlist..."></app-loading>

<app-empty-state *ngIf="!loading() && wishlistedProducts().length === 0"
  icon="bi-heart" title="Your wishlist is empty" message="Tap the heart icon on any product to save it here.">
</app-empty-state>

<div class="item-grid" *ngIf="!loading() && wishlistedProducts().length">
  <app-product-card *ngFor="let p of wishlistedProducts()" [product]="p"></app-product-card>
</div>
