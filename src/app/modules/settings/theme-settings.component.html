<div class="page-header">
  <div>
    <h4>Theme Settings</h4>
    <p class="text-muted mb-0">Customize the look and feel of your dashboard — changes apply instantly and persist across sessions.</p>
  </div>
</div>

<div class="settings-grid">

  <div class="card-surface form-app">
    <label>Theme Mode</label>
    <div class="d-flex gap-2 mb-3">
      <button class="chip" [class.active]="theme.theme().mode === 'light'" (click)="setMode('light')"><i class="bi bi-sun me-1"></i>Light</button>
      <button class="chip" [class.active]="theme.theme().mode === 'dark'" (click)="setMode('dark')"><i class="bi bi-moon-stars me-1"></i>Dark</button>
    </div>

    <label>Primary Color</label>
    <div class="d-flex gap-2 mb-2 flex-wrap">
      <span class="theme-swatch" *ngFor="let c of colorPresets"
            [style.background]="c"
            [class.active]="theme.theme().primaryColor === c"
            (click)="setColor(c)"></span>
      <input type="color" class="color-picker-input" [value]="theme.theme().primaryColor"
             (input)="setColor($any($event.target).value)">
    </div>
  </div>

  <div class="card-surface form-app">
    <label>Font Family</label>
    <select (change)="setFont($event)" [value]="theme.theme().font">
      <option *ngFor="let f of fonts" [value]="f">{{ f }}</option>
    </select>

    <label class="mt-3">Font Size</label>
    <div class="d-flex gap-2">
      <button class="chip" *ngFor="let s of fontSizes" [class.active]="theme.theme().fontSize === s" (click)="setFontSize(s)">
        {{ s }}
      </button>
    </div>
  </div>

  <div class="card-surface form-app">
    <label>Sidebar Layout</label>
    <div class="d-flex gap-2 mb-3">
      <button class="chip" [class.active]="theme.theme().sidebarMode === 'expanded'" (click)="setSidebarMode('expanded')">Expanded</button>
      <button class="chip" [class.active]="theme.theme().sidebarMode === 'compact'" (click)="setSidebarMode('compact')">Compact</button>
    </div>

    <button class="btn-app-outline btn" (click)="reset()"><i class="bi bi-arrow-counterclockwise me-1"></i> Reset to Default</button>
  </div>

</div>
