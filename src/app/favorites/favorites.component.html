<h5 class="mb-3"><i class="bi bi-heart-fill text-danger me-1"></i> Favorites</h5>

<div class="card-surface" *ngIf="favoriteItems().length; else emptyFav">
  <div class="table-responsive">
    <table class="table-app">
      <thead>
        <tr>
          <th>Item</th>
          <th>Category</th>
          <th>Brand</th>
          <th>Price</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of favoriteItems(); track item.id) {
        <tr>
          <td>{{ item.name }}</td>
          <td>{{ data.getCategoryName(item.category) }}</td>
          <td>{{ item.brand }}</td>
          <td>Rs {{ item.price | number }}</td>
          <td class="d-flex gap-2">
            <button class="btn-app-primary btn btn-sm" (click)="cart.addToCart(item, 1)">
              <i class="bi bi-cart-plus"></i>
            </button>
            <button class="btn-icon-danger" (click)="fav.toggle(item.id)">
              <i class="bi bi-heart-fill"></i>
            </button>
          </td>
        </tr>
      }
      </tbody>
    </table>
  </div>
</div>

<ng-template #emptyFav>
  <div class="card-surface text-center text-muted py-5">
    No favorites yet. Tap the heart icon on any item in <b>POS</b> to save it here.
  </div>
</ng-template>
